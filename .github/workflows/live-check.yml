name: Check the live site

# Once a week, and by hand from the Actions tab: opens the published site in a browser and runs the checks that
# come before every deploy, then checks that every address in the sitemap answers, that the GTFS feed downloads,
# that the site runs the code on main, and that the timetables were checked recently. It only reads the site.
# GitHub emails whoever last changed this schedule when a run fails. GitHub pauses schedules in a public
# repository after 60 days without activity; a push, or "Enable workflow" on the Actions tab, restarts it.
on:
  schedule:
    - cron: "23 1 * * 1" # Mondays, 06:53 India time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the checking tools (package-lock.json)
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check https://syaamantakdas.github.io/IVB/
        run: node tests/ui.mjs --live
