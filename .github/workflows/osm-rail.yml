name: Fetch OpenStreetMap railway lines

# Run by hand when the track lines need refreshing. It saves India's railway lines from OpenStreetMap
# (© OpenStreetMap contributors, ODbL) on the osm-data branch, where tools/build-shapes.mjs reads them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass for India's main and branch railway lines
        run: |
          mkdir -p osm
          query='[out:json][timeout:1500][maxsize:2000000000];area["ISO3166-1"="IN"][admin_level=2]->.in;way["railway"~"^(rail|construction)$"][!"service"](area.in);out skel geom;'
          for endpoint in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            if curl -sS --fail --retry 2 --max-time 1800 -o osm/rail.json --data-urlencode "data=$query" "$endpoint"; then break; fi
          done
          ls -la osm
          python3 -c "import json; d=json.load(open('osm/rail.json')); print(len(d['elements']), 'ways')"
          gzip -9 osm/rail.json
      - name: Save it on the osm-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan osm-data
          git rm -rq --cached .
          git add osm/rail.json.gz
          git commit -m "India's railway lines from OpenStreetMap, $(date -u +%F). © OpenStreetMap contributors, ODbL 1.0"
          git push -f origin osm-data
