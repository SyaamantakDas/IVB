name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs can read the repository; only the deploy job may publish to Pages.
permissions:
  contents: read

# One run per branch or pull request. A newer run of a pull request replaces the older one; on main, a deploy
# that has started is left to finish and the newest push waits for it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install the checking tools (package-lock.json)
        run: npm ci
      - run: node tools/format-data.mjs --check
      - run: node tests/run.js
      - name: Lint (ESLint) and layout (Prettier)
        run: |
          npx eslint .
          npx prettier --check .
      - name: Check the library's types
        run: npx tsc -p jsconfig.json
      - name: Check file sizes against their budgets
        run: node tools/check-size.mjs
      - name: Test the site in a browser, with accessibility checks
        run: |
          npx playwright install --with-deps chromium
          node tests/ui.mjs
      - name: Build the GTFS feed
        run: node tools/build-gtfs.mjs gtfs
      - name: Validate it with MobilityData's GTFS Validator
        run: |
          curl -sSfL -o gtfs-validator.jar https://github.com/MobilityData/gtfs-validator/releases/download/v7.1.0/gtfs-validator-7.1.0-cli.jar
          java -jar gtfs-validator.jar -i gtfs/ivb-gtfs.zip -o gtfs/report -c in
          node tools/check-gtfs-report.mjs gtfs/report/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtfs
          path: gtfs/
      - name: Build a page for every train, station, place, journey and circuit
        run: node tools/build-pages.mjs pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages
          path: pages/

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gtfs
          path: gtfs/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages
          path: .
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
